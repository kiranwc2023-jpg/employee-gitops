apiVersion: v1
kind: ConfigMap

metadata:
  name: employee-service-config
  namespace: employee-prod
  labels:
    app.kubernetes.io/name: employee-service

# data: plaintext key-value configuration.
# These values are injected as environment variables into the pod
# via the Deployment's env.valueFrom.configMapKeyRef entries.
data:
  database-url: "jdbc:postgresql://employee-db.c6bkecs4w3jk.us-east-1.rds.amazonaws.com:5432/employeedb"
  database-username: "employeeuser"

  spring.jpa.show-sql: "false"
  spring.h2.console.enabled: "false"
  management.endpoints.web.exposure.include: "health,info,metrics,prometheus"
  management.endpoint.health.show-details: "always"
  logging.level.root: "INFO"
  logging.level.com.company.employee: "INFO"
